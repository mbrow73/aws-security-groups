name: "Reference Grant"

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: reference-grant-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  reference-grant:
    name: "Create reference grant PR"
    if: contains(github.event.issue.labels.*.name, 'reference-grant')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SG_FRAMEWORK_PAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "sg-framework-bot"
          git config user.email "sg-framework-bot@users.noreply.github.com"

      - name: Write issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s\n' "$ISSUE_BODY" > /tmp/reference-grant-issue-body.md

      - name: Apply reference grant request
        id: apply
        run: |
          python3 scripts/reference_grant_issue.py \
            --repo-root . \
            --issue-body-file /tmp/reference-grant-issue-body.md \
            --output-json /tmp/reference-grant-result.json
          echo "result=$(jq -c . /tmp/reference-grant-result.json)" >> "$GITHUB_OUTPUT"

      - name: Create branch and commit
        id: commit
        run: |
          TARGET=$(jq -r .target_tenant /tmp/reference-grant-result.json)
          GRANT=$(jq -r .grant_name /tmp/reference-grant-result.json)
          BRANCH="reference-grant/issue-${{ github.event.issue.number }}-${TARGET}-${GRANT}"
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH" origin/main
          git add registry/tenants.yaml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Add reference grant from issue #${{ github.event.issue.number }}"
          git push --force-with-lease -u origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SG_FRAMEWORK_PAT || github.token }}
          script: |
            const result = JSON.parse(`${{ steps.apply.outputs.result }}`);
            const { owner, repo } = context.repo;
            const title = `Reference grant: ${result.target_tenant}/${result.grant_name}`;
            const platform = result.platform_review_required
              ? `Platform review required: ${result.platform_review_reasons.join(', ')}`
              : 'Platform review not required by grant risk classifier.';
            const body = [
              `Generated from #${context.issue.number}.`,
              '',
              '## Summary',
              `- Target tenant: \`${result.target_tenant}\``,
              `- Grant: \`${result.grant_name}\``,
              `- Target authority: \`${result.target_authority || 'unknown'}\``,
              `- ${platform}`,
              '',
              '## Review',
              'Narrow grants should require target tenant authority. Broad grants also require platform review.',
            ].join('\n');
            const existing = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${{ steps.commit.outputs.branch }}`, base: 'main' });
            const pr = existing.data.length ? existing.data[0] : (await github.rest.pulls.create({ owner, repo, title, head: `${{ steps.commit.outputs.branch }}`, base: 'main', body })).data;
            core.setOutput('url', pr.html_url);

      - name: Comment on issue
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SG_FRAMEWORK_PAT || github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Created reference grant PR: ${{ steps.pr.outputs.url }}`,
            });
