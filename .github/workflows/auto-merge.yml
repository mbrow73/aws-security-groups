name: "Auto Merge"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows:
      - "Validate Security Groups PR"
      - "Review Gate"
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  statuses: read
  checks: read
  issues: write

jobs:
  auto-merge:
    name: "Auto Merge Candidate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate auto-merge candidate
        uses: actions/github-script@v7
        env:
          AUTO_MERGE_MODE: ${{ vars.AUTO_MERGE_MODE || 'dry-run' }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');

            const { owner, repo } = context.repo;
            const mode = (process.env.AUTO_MERGE_MODE || 'dry-run').toLowerCase();

            async function resolvePullRequest() {
              if (context.payload.pull_request) return context.payload.pull_request;
              if (context.payload.workflow_run?.pull_requests?.length) {
                const prRef = context.payload.workflow_run.pull_requests[0];
                return (await github.rest.pulls.get({ owner, repo, pull_number: prRef.number })).data;
              }
              return null;
            }

            const pr = await resolvePullRequest();
            if (!pr) {
              core.info('No PR associated with event; nothing to evaluate.');
              return;
            }

            const pr_number = pr.number;
            const freshPr = (await github.rest.pulls.get({ owner, repo, pull_number: pr_number })).data;
            const sha = freshPr.head.sha;
            execFileSync('git', ['fetch', 'origin', `+refs/pull/${pr_number}/head:refs/remotes/origin/pr-${pr_number}`], { stdio: 'inherit' });
            execFileSync('git', ['checkout', '--force', `refs/remotes/origin/pr-${pr_number}`], { stdio: 'inherit' });
            const marker = '<!-- sg-auto-merge-bot -->';
            const reasons = [];

            function accountIdFromPath(filename) {
              const match = filename.match(/^accounts\/(\d{12})(?:\/[^\/]+)?\/security-groups\.yaml$/);
              return match ? match[1] : null;
            }

            function postResult(status, detailLines) {
              const body = [
                marker,
                '## 🤖 Auto-Merge Evaluation',
                '',
                `**Mode:** \`${mode}\``,
                `**Status:** ${status}`,
                '',
                ...detailLines,
              ].join('\n');
              return github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr_number })
                .then(comments => comments.find(comment => comment.body?.includes(marker)))
                .then(existing => existing
                  ? github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
                  : github.rest.issues.createComment({ owner, repo, issue_number: pr_number, body })
                );
            }

            if (freshPr.draft) reasons.push('PR is draft');
            if (freshPr.mergeable === false) reasons.push('PR is not mergeable');
            if (freshPr.state !== 'open') reasons.push(`PR is ${freshPr.state}`);

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr_number });
            const changedFiles = files.map(f => f.filename);
            fs.writeFileSync('/tmp/sg-changed-files.txt', changedFiles.join('\n') + '\n');

            const changedAccounts = [...new Set(changedFiles.map(accountIdFromPath).filter(Boolean))];
            if (!changedAccounts.length) reasons.push('No account security-groups.yaml changes detected');
            if (changedAccounts.length > 1) reasons.push('More than one account changed');

            const frameworkChanged = changedFiles.some(filename =>
              filename.startsWith('modules/') ||
              filename.startsWith('scripts/') ||
              filename.startsWith('.github/') ||
              filename.startsWith('registry/') ||
              filename === 'guardrails.yaml' ||
              filename === 'known-prefix-lists.yaml' ||
              filename === 'shared-prefix-lists.yaml'
            );
            if (frameworkChanged) reasons.push('Framework, workflow, registry, guardrail, or prefix-list files changed');

            const policies = [];
            for (const accountId of changedAccounts) {
              const policy = JSON.parse(execFileSync(
                'python3',
                ['scripts/policy_summary.py', `accounts/${accountId}`, '--changed-files', '/tmp/sg-changed-files.txt'],
                { encoding: 'utf8' }
              ));
              policies.push(policy);
              if (!policy.auto_merge_eligible) reasons.push(`Account ${accountId} is not auto-merge eligible: ${policy.auto_merge_reason}`);
              if (Object.keys(policy.required_review_authorities || {}).length) reasons.push(`Account ${accountId} still has required review authorities`);
            }

            const combined = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
            const statuses = combined.data.statuses || [];
            const reviewGate = statuses.find(status => status.context === 'Review Gate');
            if (!reviewGate || reviewGate.state !== 'success') reasons.push('Review Gate status is not successful');

            const checkRuns = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: sha, per_page: 100 });
            const requiredCheckNames = [
              'Detect Changed Accounts',
              'Validate Security Groups',
              'Post Validation Summary',
              'Post Change Summary',
              'Slack Review Notification',
              'Review Requirements',
            ];
            for (const name of requiredCheckNames) {
              const runs = checkRuns.filter(run => run.name === name);
              if (!runs.length) {
                reasons.push(`${name} check is missing`);
                continue;
              }
              const latest = runs.sort((a, b) => new Date(b.started_at || b.created_at) - new Date(a.started_at || a.created_at))[0];
              if (latest.status !== 'completed' || latest.conclusion !== 'success') {
                reasons.push(`${name} check is ${latest.status}/${latest.conclusion}`);
              }
            }

            const detailLines = [
              '### Policy',
              policies.length ? policies.map(policy => `- Account \`${policy.account_id}\`: ${policy.auto_merge_eligible ? '✅ eligible' : '❌ not eligible'}${policy.auto_merge_reason ? `, ${policy.auto_merge_reason}` : ''}`).join('\n') : '- Not evaluated',
              '',
              '### Gate checks',
              `- Review Gate: ${reviewGate ? reviewGate.state : 'missing'}`,
              ...requiredCheckNames.map(name => {
                const runs = checkRuns.filter(run => run.name === name);
                if (!runs.length) return `- ${name}: missing`;
                const latest = runs.sort((a, b) => new Date(b.started_at || b.created_at) - new Date(a.started_at || a.created_at))[0];
                return `- ${name}: ${latest.status}/${latest.conclusion}`;
              }),
              '',
              '### Blockers',
              reasons.length ? reasons.map(reason => `- ${reason}`).join('\n') : '- None',
            ];

            if (reasons.length) {
              await postResult('⏳ not ready', detailLines);
              return;
            }

            if (mode !== 'enabled') {
              await postResult('✅ would auto-merge', [...detailLines, '', 'Dry-run mode only. Set repository variable `AUTO_MERGE_MODE=enabled` to allow merges.']);
              return;
            }

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr_number,
              merge_method: 'squash',
              commit_title: freshPr.title,
            });
            await postResult('✅ auto-merged', detailLines);
