name: "Validate Security Groups PR"

on:
  pull_request:
    branches: [main]
    paths:
      - 'accounts/**'
      - 'guardrails.yaml'
      - 'known-prefix-lists.yaml'
      - 'modules/**'
      - 'scripts/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  detect-changes:
    name: "Detect Changed Accounts"
    runs-on: ubuntu-latest
    outputs:
      changed-accounts: ${{ steps.detect.outputs.accounts }}
      has-accounts: ${{ steps.detect.outputs.has_accounts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed accounts
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          ACCOUNTS=$(echo "$CHANGED_FILES" | grep -E '^accounts/[0-9]+/' | cut -d'/' -f2 | sort -u | tr '\n' ',' | sed 's/,$//')
          
          if [ -n "$ACCOUNTS" ]; then
            echo "accounts=$ACCOUNTS" >> $GITHUB_OUTPUT
            echo "has_accounts=true" >> $GITHUB_OUTPUT
          else
            echo "accounts=" >> $GITHUB_OUTPUT
            echo "has_accounts=false" >> $GITHUB_OUTPUT
          fi

  validate:
    name: "Validate Security Groups"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-accounts == 'true'
    outputs:
      summary: ${{ steps.validate.outputs.summary }}
      has_warnings: ${{ steps.validate.outputs.has_warnings }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run validation
        id: validate
        run: |
          IFS=',' read -ra ACCOUNTS <<< "${{ needs.detect-changes.outputs.changed-accounts }}"
          EXIT_CODE=0
          HAS_WARNINGS=false
          VALIDATION_OUTPUT=""
          
          for account in "${ACCOUNTS[@]}"; do
            echo "========================================="
            echo "Validating account: $account"
            echo "========================================="
            
            ACCOUNT_OUTPUT=$(python scripts/validate.py "accounts/$account" --format markdown 2>&1) || ACCOUNT_EXIT_CODE=$?
            ACCOUNT_EXIT_CODE=${ACCOUNT_EXIT_CODE:-0}
            
            VALIDATION_OUTPUT="${VALIDATION_OUTPUT}${ACCOUNT_OUTPUT}"$'\n\n'
            
            if [ $ACCOUNT_EXIT_CODE -eq 1 ]; then
              EXIT_CODE=1
            elif [ $ACCOUNT_EXIT_CODE -eq 2 ]; then
              HAS_WARNINGS=true
            fi
          done
          
          # Three outcomes:
          #   errors (exit 1)   → fail check, post error output
          #   warnings (exit 2) → pass check, post warning output
          #   clean (exit 0)    → pass check, post success message
          if [ $EXIT_CODE -eq 0 ] && [ "$HAS_WARNINGS" = false ]; then
            VALIDATION_OUTPUT="## ✅ Security Group Validation Results"$'\n\n'"**Status:** All schema, guardrails, and naming checks passed!"$'\n\n'"🚀 Once approved and merged, Terraform Enterprise will handle deployment."
          elif [ $EXIT_CODE -eq 0 ] && [ "$HAS_WARNINGS" = true ]; then
            VALIDATION_OUTPUT="## ⚠️ Security Group Validation Results"$'\n\n'"**Status:** Passed with warnings (non-blocking)"$'\n\n'"${VALIDATION_OUTPUT}"$'\n\n'"🚀 Once approved and merged, Terraform Enterprise will handle deployment."
          fi
          
          echo "has_warnings=$HAS_WARNINGS" >> $GITHUB_OUTPUT
          
          # Write summary to file for artifact upload and job output
          echo "$VALIDATION_OUTPUT" > /tmp/validation-summary.md
          
          # Also set as job output (truncated to 1MB GitHub limit)
          {
            echo "summary<<SUMMARY_EOF"
            head -c 1000000 /tmp/validation-summary.md
            echo "SUMMARY_EOF"
          } >> $GITHUB_OUTPUT
          
          exit $EXIT_CODE

  post-summary:
    name: "Post Validation Summary"
    runs-on: ubuntu-latest
    needs: [detect-changes, validate]
    if: always() && needs.detect-changes.outputs.has-accounts == 'true'
    steps:
      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            // Get the summary from the validate job output
            const summary = `${{ needs.validate.outputs.summary }}`;
            
            if (!summary || summary.trim() === '') {
              console.log('No validation summary to post');
              return;
            }
            
            // Delete previous validation comments from this workflow
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            for (const comment of comments.data) {
              if (comment.user.login === 'github-actions[bot]' && 
                  comment.body.includes('Security Group Validation Results')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }
            
            // Post new summary
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  change-summary:
    name: "Post Change Summary"
    runs-on: ubuntu-latest
    needs: [detect-changes, validate]
    if: always() && needs.detect-changes.outputs.has-accounts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Manage change summary comment
        uses: actions/github-script@v7
        env:
          CHANGED_ACCOUNTS: ${{ needs.detect-changes.outputs.changed-accounts }}
          HAS_WARNINGS: ${{ needs.validate.outputs.has_warnings }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.payload.pull_request.number;
            const marker = '<!-- sg-change-summary-bot -->';

            // Delete any existing summary comment first
            const comments = await github.rest.issues.listComments({
              issue_number: pr_number, owner, repo
            });
            for (const comment of comments.data) {
              if (comment.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner, repo, comment_id: comment.id
                });
              }
            }

            // Only post summary if validation passed
            if (process.env.VALIDATE_RESULT !== 'success') {
              console.log('Validation failed — summary removed (if it existed)');
              return;
            }

            // Run the Python script to generate summary
            const { execSync } = require('child_process');
            try {
              const summary = execSync('python scripts/pr_summary.py', {
                encoding: 'utf8',
                env: {
                  ...process.env,
                  CHANGED_ACCOUNTS: process.env.CHANGED_ACCOUNTS,
                  HAS_WARNINGS: process.env.HAS_WARNINGS,
                  BASE_REF: process.env.BASE_REF,
                },
                timeout: 30000,
              });

              if (summary && summary.includes(marker)) {
                await github.rest.issues.createComment({
                  issue_number: pr_number, owner, repo,
                  body: summary
                });
                console.log('✅ Change summary posted');
              } else {
                console.log('No changes detected — no summary posted');
              }
            } catch (e) {
              console.log(`::warning::Failed to generate summary: ${e.message}`);
            }

  slack-notify:
    name: "Slack Review Notification"
    runs-on: ubuntu-latest
    needs: [detect-changes, validate]
    if: needs.validate.result == 'success' && needs.detect-changes.outputs.has-accounts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build and send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHANGED_ACCOUNTS: ${{ needs.detect-changes.outputs.changed-accounts }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          HAS_WARNINGS: ${{ needs.validate.outputs.has_warnings }}
        run: python scripts/slack_notify.py
