name: "Tenant Onboarding"

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: tenant-onboarding-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  tenant-onboarding:
    name: "Create tenant registry PR"
    if: contains(github.event.issue.labels.*.name, 'tenant-onboarding')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SG_FRAMEWORK_PAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "sg-framework-bot"
          git config user.email "sg-framework-bot@users.noreply.github.com"

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyyaml

      - name: Write issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s\n' "$ISSUE_BODY" > /tmp/tenant-issue-body.md

      - name: Apply tenant registry request
        id: apply
        run: |
          RESULT_FILE="$GITHUB_WORKSPACE/tenant-issue-result.json"
          LOG_FILE="$RUNNER_TEMP/tenant-issue-parser.log"
          echo "Running tenant_registry_issue.py from $(pwd)"
          ls -l scripts/tenant_registry_issue.py
          set +e
          .venv/bin/python scripts/tenant_registry_issue.py \
            --repo-root . \
            --issue-body-file /tmp/tenant-issue-body.md \
            --output-json "$RESULT_FILE" >"$LOG_FILE" 2>&1
          PARSER_EXIT=$?
          set -e
          echo "Parser exit code: $PARSER_EXIT"
          echo "Parser log:"
          cat "$LOG_FILE"
          echo "Result file status:"
          ls -l "$RESULT_FILE" || true
          if [ $PARSER_EXIT -ne 0 ]; then
            echo "::error::Tenant registry issue parser failed with exit code $PARSER_EXIT"
            exit $PARSER_EXIT
          fi
          if [ ! -s "$RESULT_FILE" ]; then
            echo "::error::Tenant registry issue parser exited 0 but did not create $RESULT_FILE"
            echo "Issue body follows for debugging:"
            sed -n '1,220p' /tmp/tenant-issue-body.md
            exit 1
          fi
          TENANT=$(jq -r .tenant_slug "$RESULT_FILE")
          echo "tenant_slug=$TENANT" >> "$GITHUB_OUTPUT"

      - name: Create branch and commit
        if: success()
        id: commit
        run: |
          TENANT=$(jq -r .tenant_slug tenant-issue-result.json)
          if [ -z "$TENANT" ] || [ "$TENANT" = "null" ]; then
            echo "::error::tenant_slug missing from tenant-issue-result.json"
            cat tenant-issue-result.json || true
            exit 1
          fi
          BRANCH="tenant-registry/issue-${{ github.event.issue.number }}-${TENANT}"
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH" origin/main
          git add registry/tenants.yaml registry/review-authorities.yaml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Add tenant registry request from issue #${{ github.event.issue.number }}"
          git push --force-with-lease -u origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: success() && steps.commit.outputs.changed == 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SG_FRAMEWORK_PAT || github.token }}
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('tenant-issue-result.json', 'utf8'));
            const { owner, repo } = context.repo;
            const title = `Tenant registry request: ${result.tenant_slug}`;
            const body = [
              `Generated from #${context.issue.number}.`,
              '',
              '## Summary',
              ...(result.changed || []).map(item => `- ${item}`),
              '',
              '## Review',
              'Registry changes require platform review through Review Gate.',
            ].join('\n');
            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${{ steps.commit.outputs.branch }}`, base: 'main'
            });
            const pr = existing.data.length ? existing.data[0] : (await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: `${{ steps.commit.outputs.branch }}`,
              base: 'main',
              body,
            })).data;
            core.setOutput('url', pr.html_url);

      - name: Comment on issue
        if: success() && steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SG_FRAMEWORK_PAT || github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Created tenant registry PR: ${{ steps.pr.outputs.url }}`,
            });

      - name: Comment no changes
        if: success() && steps.commit.outputs.changed == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SG_FRAMEWORK_PAT || github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Tenant registry automation ran, but no registry changes were detected.',
            });
