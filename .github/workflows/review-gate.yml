name: "Review Gate"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  review-gate:
    name: "Review Requirements"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check review requirements
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.payload.pull_request?.number
              || context.payload.review?.pull_request?.number;

            if (!pr_number) {
              core.setFailed('Could not determine PR number');
              return;
            }

            // Get the PR to find the head SHA
            const pr = await github.rest.pulls.get({
              owner, repo, pull_number: pr_number
            });
            const sha = pr.data.head.sha;

            // Get changed files in the PR
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr_number }
            );

            // Check if any changed account YAML has environment: prod
            const fs = require('fs');
            let hasProd = false;
            const prodAccounts = [];
            const nonprodAccounts = [];

            for (const file of files) {
              const match = file.filename.match(
                /^accounts\/(\d{12})\/security-groups\.yaml$/
              );
              if (!match) continue;

              const accountId = match[1];

              try {
                const content = fs.readFileSync(file.filename, 'utf8');
                // Match environment value — tolerates quotes, trailing
                // comments, whitespace, and \r\n line endings.
                const envMatch = content.match(
                  /^environment:\s*["']?(\w+)["']?/m
                );
                const env = envMatch?.[1]?.toLowerCase() || 'prod';
                console.log(`  ${file.filename}: environment=${env} (raw match: ${envMatch?.[0]})`);

                if (env === 'prod') {
                  hasProd = true;
                  prodAccounts.push(accountId);
                } else {
                  nonprodAccounts.push(accountId);
                }
              } catch (e) {
                console.log(
                  `⚠️ Could not read ${file.filename}, assuming prod`
                );
                hasProd = true;
                prodAccounts.push(accountId);
              }
            }

            const required = hasProd ? 2 : 1;
            const envLabel = hasProd ? 'prod' : 'nonprod';

            if (prodAccounts.length === 0 && nonprodAccounts.length === 0) {
              console.log('No account YAMLs changed — framework change, requiring 1 review');
            }

            // Get current approvals (deduplicated by user)
            const reviews = await github.rest.pulls.listReviews({
              owner, repo, pull_number: pr_number
            });

            const latestByUser = new Map();
            for (const review of reviews.data) {
              if (review.state === 'APPROVED' || review.state === 'CHANGES_REQUESTED') {
                latestByUser.set(review.user.login, review.state);
              }
            }

            const approvals = [...latestByUser.values()]
              .filter(state => state === 'APPROVED').length;

            const passed = approvals >= required;

            // Write a single commit status — this is what branch protection checks.
            // Both pull_request and pull_request_review triggers update the SAME
            // status on the SAME SHA, so there's only ever one check to evaluate.
            const description = passed
              ? `✅ ${approvals}/${required} approvals (${envLabel})`
              : `❌ ${approvals}/${required} approvals needed (${envLabel})`;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: passed ? 'success' : 'pending',
              context: 'Review Gate',
              description: description.substring(0, 140),
              target_url: `https://github.com/${owner}/${repo}/pull/${pr_number}#pullrequestreview`
            });

            console.log(`Review Gate: ${description}`);

            if (prodAccounts.length > 0) {
              console.log(`Prod accounts: ${prodAccounts.join(', ')}`);
            }
            if (nonprodAccounts.length > 0) {
              console.log(`Nonprod accounts: ${nonprodAccounts.join(', ')}`);
            }
