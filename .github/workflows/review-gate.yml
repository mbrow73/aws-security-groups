name: "Review Gate"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  review-gate:
    name: "Review Requirements"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check review requirements
        uses: actions/github-script@v7
        env:
          REVIEW_GATE_PAT: ${{ secrets.REVIEW_GATE_PAT }}
        with:
          script: |
            const fs = require('fs');
            const https = require('https');
            const yaml = require('js-yaml');

            const { owner, repo } = context.repo;
            const pr_number = context.payload.pull_request?.number
              || context.payload.review?.pull_request?.number;

            if (!pr_number) {
              core.setFailed('Could not determine PR number');
              return;
            }

            const registryPath = 'registry/review-authorities.yaml';
            if (!fs.existsSync(registryPath)) {
              core.setFailed(`${registryPath} is required for Review Gate`);
              return;
            }

            const registry = yaml.load(fs.readFileSync(registryPath, 'utf8')) || {};
            const authorities = registry.authorities || {};
            const rules = registry.rules || {};
            const token = process.env.REVIEW_GATE_PAT;

            const pr = await github.rest.pulls.get({
              owner, repo, pull_number: pr_number
            });
            const sha = pr.data.head.sha;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr_number }
            );

            let hasProd = false;
            const prodAccounts = [];
            const nonprodAccounts = [];

            for (const file of files) {
              const match = file.filename.match(
                /^accounts\/(\d{12})(?:\/[^\/]+)?\/security-groups\.yaml$/
              );
              if (!match) continue;

              const accountId = match[1];

              try {
                const content = fs.readFileSync(file.filename, 'utf8');
                const envMatch = content.match(
                  /^environment:\s*["']?(\w+)["']?/m
                );
                const env = envMatch?.[1]?.toLowerCase() || 'prod';
                console.log(`  ${file.filename}: environment=${env}`);

                if (env === 'prod') {
                  hasProd = true;
                  prodAccounts.push(accountId);
                } else {
                  nonprodAccounts.push(accountId);
                }
              } catch (e) {
                console.log(`⚠️ Could not read ${file.filename}, assuming prod`);
                hasProd = true;
                prodAccounts.push(accountId);
              }
            }

            const FRAMEWORK_PATHS = [
              'modules/', 'scripts/', '.github/', 'registry/',
              'guardrails.yaml', 'known-prefix-lists.yaml', 'shared-prefix-lists.yaml'
            ];
            const frameworkFiles = files.filter(f =>
              FRAMEWORK_PATHS.some(p => f.filename.startsWith(p) || f.filename === p)
            );
            const frameworkChanged = frameworkFiles.length > 0;

            if (frameworkChanged) {
              console.log(`🔧 Framework files changed (${frameworkFiles.length}):`);
              frameworkFiles.forEach(f => console.log(`  ${f.filename}`));
            }

            const ruleName = frameworkChanged ? 'framework' : hasProd ? 'prod_account' : 'nonprod_account';
            const rule = rules[ruleName];
            if (!rule) {
              core.setFailed(`Missing review rule '${ruleName}' in ${registryPath}`);
              return;
            }

            const authority = authorities[rule.authority];
            if (!authority) {
              core.setFailed(`Missing review authority '${rule.authority}' in ${registryPath}`);
              return;
            }

            const requiredAuthorityApprovals = Number(rule.required_authority_approvals || 1);
            const envLabel = ruleName.replace('_', '-');

            const reviews = await github.rest.pulls.listReviews({
              owner, repo, pull_number: pr_number
            });

            const latestByUser = new Map();
            for (const review of reviews.data) {
              if (review.state === 'APPROVED' || review.state === 'CHANGES_REQUESTED') {
                latestByUser.set(review.user.login, review.state);
              }
            }

            const approvingUsers = [...latestByUser.entries()]
              .filter(([, state]) => state === 'APPROVED')
              .map(([login]) => login);

            async function getTeamMembers(host, org, teamSlug, pat) {
              if (!pat) {
                throw new Error('REVIEW_GATE_PAT secret is required to resolve GHE team membership');
              }

              const members = new Set();
              let page = 1;
              while (true) {
                const path = `/api/v3/orgs/${org}/teams/${teamSlug}/members?per_page=100&page=${page}`;
                const data = await new Promise((resolve, reject) => {
                  const req = https.request({
                    hostname: host,
                    path,
                    method: 'GET',
                    headers: {
                      'Authorization': `Bearer ${pat}`,
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'aws-security-groups-review-gate'
                    }
                  }, res => {
                    let body = '';
                    res.on('data', chunk => body += chunk);
                    res.on('end', () => {
                      if (res.statusCode < 200 || res.statusCode >= 300) {
                        reject(new Error(`GHE team lookup failed with HTTP ${res.statusCode}: ${body}`));
                        return;
                      }
                      resolve(JSON.parse(body));
                    });
                  });
                  req.on('error', reject);
                  req.end();
                });

                for (const member of data) {
                  if (member.login) members.add(member.login);
                }
                if (!Array.isArray(data) || data.length < 100) break;
                page += 1;
              }
              return members;
            }

            const teamMembers = await getTeamMembers(
              authority.ghe_host,
              authority.org,
              authority.team_slug,
              token
            );

            const authorityApprovers = approvingUsers.filter(user => teamMembers.has(user));
            const passed = authorityApprovers.length >= requiredAuthorityApprovals;
            const teamRef = `${authority.org}/${authority.team_slug}`;
            const description = passed
              ? `✅ ${authorityApprovers.length}/${requiredAuthorityApprovals} ${teamRef} approvals (${envLabel})`
              : `❌ ${authorityApprovers.length}/${requiredAuthorityApprovals} ${teamRef} approvals needed (${envLabel})`;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: passed ? 'success' : 'pending',
              context: 'Review Gate',
              description: description.substring(0, 140),
              target_url: `${pr.data.html_url}#pullrequestreview`
            });

            console.log(`Review Gate: ${description}`);
            console.log(`Approving users: ${approvingUsers.join(', ') || 'none'}`);
            console.log(`Authority approvers: ${authorityApprovers.join(', ') || 'none'}`);

            if (prodAccounts.length > 0) {
              console.log(`Prod accounts: ${prodAccounts.join(', ')}`);
            }
            if (nonprodAccounts.length > 0) {
              console.log(`Nonprod accounts: ${nonprodAccounts.join(', ')}`);
            }
