name: "Review Gate"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  review-gate:
    name: "Review Requirements"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check review requirements
        uses: actions/github-script@v7
        env:
          REVIEW_GATE_PAT: ${{ secrets.REVIEW_GATE_PAT }}
        with:
          script: |
            const fs = require('fs');
            const https = require('https');
            const yaml = require('js-yaml');

            const { owner, repo } = context.repo;
            const pr_number = context.payload.pull_request?.number
              || context.payload.review?.pull_request?.number;

            if (!pr_number) {
              core.setFailed('Could not determine PR number');
              return;
            }

            const authorityRegistryPath = 'registry/review-authorities.yaml';
            const tenantRegistryPath = 'registry/tenants.yaml';
            const platformSgRegistryPath = 'registry/platform-security-groups.yaml';

            for (const path of [authorityRegistryPath, tenantRegistryPath]) {
              if (!fs.existsSync(path)) {
                core.setFailed(`${path} is required for Review Gate`);
                return;
              }
            }

            const authorityRegistry = yaml.load(fs.readFileSync(authorityRegistryPath, 'utf8')) || {};
            const authorities = authorityRegistry.authorities || {};
            const rules = authorityRegistry.rules || {};
            const tenantRegistry = yaml.load(fs.readFileSync(tenantRegistryPath, 'utf8')) || {};
            const tenants = tenantRegistry.tenants || {};
            const platformSgRegistry = fs.existsSync(platformSgRegistryPath)
              ? (yaml.load(fs.readFileSync(platformSgRegistryPath, 'utf8')) || {})
              : {};
            const platformSecurityGroups = platformSgRegistry.platform_security_groups || {};
            const token = process.env.REVIEW_GATE_PAT;

            const pr = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            const sha = pr.data.head.sha;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr_number });

            const FRAMEWORK_PATHS = [
              'modules/', 'scripts/', '.github/', 'registry/',
              'guardrails.yaml', 'known-prefix-lists.yaml', 'shared-prefix-lists.yaml'
            ];
            const frameworkFiles = files.filter(f =>
              FRAMEWORK_PATHS.some(p => f.filename.startsWith(p) || f.filename === p)
            );
            const frameworkChanged = frameworkFiles.length > 0;

            const requirements = new Map();
            const requirementReasons = [];

            function requireAuthority(authorityName, count, reason) {
              if (!authorityName) authorityName = 'platform-sg';
              if (!authorities[authorityName]) {
                throw new Error(`Missing review authority '${authorityName}' in ${authorityRegistryPath}`);
              }
              const current = requirements.get(authorityName) || 0;
              requirements.set(authorityName, Math.max(current, Number(count || 1)));
              requirementReasons.push(`${authorityName}: ${count} (${reason})`);
            }

            function tenantAuthority(tenantSlug) {
              const tenant = tenants[tenantSlug];
              if (!tenant) return 'platform-sg';
              return tenant.review_authority || 'platform-sg';
            }

            function envFromConfig(data) {
              return String(data?.environment || 'prod').toLowerCase();
            }

            function accountFileParts(filename) {
              const match = filename.match(/^accounts\/(\d{12})(?:\/([^\/]+))?\/security-groups\.yaml$/);
              if (!match) return null;
              return { accountId: match[1], tenant: match[2] || 'default' };
            }

            function discoverAccountFiles(accountId) {
              const accountDir = `accounts/${accountId}`;
              const legacyPath = `${accountDir}/security-groups.yaml`;
              if (fs.existsSync(legacyPath)) return [{ path: legacyPath, tenant: 'default' }];
              if (!fs.existsSync(accountDir)) return [];
              return fs.readdirSync(accountDir, { withFileTypes: true })
                .filter(entry => entry.isDirectory())
                .map(entry => ({ path: `${accountDir}/${entry.name}/security-groups.yaml`, tenant: entry.name }))
                .filter(entry => fs.existsSync(entry.path));
            }

            function loadYamlFile(path) {
              return yaml.load(fs.readFileSync(path, 'utf8')) || {};
            }

            function buildSgTenantMap(accountId) {
              const map = new Map();
              for (const source of discoverAccountFiles(accountId)) {
                const data = loadYamlFile(source.path);
                const securityGroups = data.security_groups || {};
                for (const sgName of Object.keys(securityGroups)) {
                  map.set(sgName, source.tenant);
                }
              }
              return map;
            }

            function referencedSecurityGroups(rule) {
              if (!rule || typeof rule !== 'object') return [];
              const refs = rule.security_groups || [];
              return Array.isArray(refs) ? refs : [];
            }

            function portMatches(grant, fromPort, toPort) {
              if (fromPort === undefined || toPort === undefined) return false;
              const ports = grant.ports || [];
              if (Number(fromPort) === Number(toPort) && ports.map(Number).includes(Number(fromPort))) {
                return true;
              }
              for (const range of grant.port_ranges || []) {
                if (Number(fromPort) >= Number(range.from) && Number(toPort) <= Number(range.to)) {
                  return true;
                }
              }
              return false;
            }

            function grantNotExpired(grant) {
              if (!grant.expires) return true;
              const expiry = new Date(`${grant.expires}T23:59:59Z`);
              return expiry >= new Date();
            }

            function matchingReferenceGrant(sourceTenant, targetTenant, targetSg, ruleType, rule) {
              const target = tenants[targetTenant] || {};
              for (const grant of target.reference_grants || []) {
                if (grant.decision !== 'auto_approved') continue;
                if (!(grant.target_sgs || []).includes(targetSg)) continue;
                const sourceTenants = grant.source_tenants || [];
                if (!sourceTenants.includes('*') && !sourceTenants.includes(sourceTenant)) continue;
                const protocols = (grant.protocols || []).map(p => String(p).toLowerCase());
                if (protocols.length && !protocols.includes(String(rule.protocol || '').toLowerCase())) continue;
                const directions = (grant.directions || []).map(d => String(d).toLowerCase());
                if (directions.length && !directions.includes(String(ruleType).toLowerCase())) continue;
                if (!portMatches(grant, rule.from_port, rule.to_port)) continue;
                if (!grantNotExpired(grant)) continue;
                return grant;
              }
              return null;
            }

            if (frameworkChanged) {
              requireAuthority('platform-sg', rules.framework?.required_authority_approvals || 2, 'framework/registry/workflow change');
              console.log(`🔧 Framework files changed (${frameworkFiles.length})`);
            }

            const changedAccountFiles = files
              .map(f => ({ file: f, parts: accountFileParts(f.filename) }))
              .filter(item => item.parts);

            const accountTenantMaps = new Map();
            for (const item of changedAccountFiles) {
              const { accountId, tenant } = item.parts;
              const data = loadYamlFile(item.file.filename);
              const env = envFromConfig(data);
              const ruleName = env === 'prod' ? 'prod_account' : 'nonprod_account';
              const required = rules[ruleName]?.required_authority_approvals || (env === 'prod' ? 2 : 1);
              const sourceAuthority = tenantAuthority(tenant);
              requireAuthority(sourceAuthority, required, `${env} ${tenant} account change`);

              if (!accountTenantMaps.has(accountId)) {
                accountTenantMaps.set(accountId, buildSgTenantMap(accountId));
              }
              const sgTenantMap = accountTenantMaps.get(accountId);
              const securityGroups = data.security_groups || {};

              for (const [sourceSg, sgConfig] of Object.entries(securityGroups)) {
                for (const ruleType of ['ingress', 'egress']) {
                  const rulesList = Array.isArray(sgConfig?.[ruleType]) ? sgConfig[ruleType] : [];
                  for (const rule of rulesList) {
                    for (const targetSg of referencedSecurityGroups(rule)) {
                      if (platformSecurityGroups[targetSg]) {
                        console.log(`No extra review for platform built-in SG ref ${sourceSg} -> ${targetSg}`);
                        continue;
                      }
                      const targetTenant = sgTenantMap.get(targetSg);
                      if (!targetTenant) {
                        console.log(`Unknown SG ref ${sourceSg} -> ${targetSg}; validation should fail this PR`);
                        continue;
                      }
                      if (targetTenant !== tenant) {
                        const grant = matchingReferenceGrant(tenant, targetTenant, targetSg, ruleType, rule);
                        if (grant) {
                          console.log(`No extra review for granted cross-tenant SG ref ${sourceSg} -> ${targetSg} via ${grant.name}`);
                          continue;
                        }
                        requireAuthority(tenantAuthority(targetTenant), 1, `cross-tenant SG ref ${sourceSg} -> ${targetSg}`);
                      }
                    }
                  }
                }
              }
            }

            if (requirements.size === 0) {
              requireAuthority('platform-sg', 1, 'default fallback');
            }

            const reviews = await github.rest.pulls.listReviews({ owner, repo, pull_number: pr_number });
            const latestByUser = new Map();
            for (const review of reviews.data) {
              if (review.state === 'APPROVED' || review.state === 'CHANGES_REQUESTED') {
                latestByUser.set(review.user.login, review.state);
              }
            }
            const approvingUsers = [...latestByUser.entries()]
              .filter(([, state]) => state === 'APPROVED')
              .map(([login]) => login);

            const teamCache = new Map();
            async function getTeamMembers(host, org, teamSlug, pat) {
              if (!pat) throw new Error('REVIEW_GATE_PAT secret is required to resolve GHE team membership');
              const cacheKey = `${host}/${org}/${teamSlug}`;
              if (teamCache.has(cacheKey)) return teamCache.get(cacheKey);
              const members = new Set();
              let page = 1;
              while (true) {
                const path = `/api/v3/orgs/${org}/teams/${teamSlug}/members?per_page=100&page=${page}`;
                const data = await new Promise((resolve, reject) => {
                  const req = https.request({
                    hostname: host,
                    path,
                    method: 'GET',
                    headers: {
                      'Authorization': `Bearer ${pat}`,
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'aws-security-groups-review-gate'
                    }
                  }, res => {
                    let body = '';
                    res.on('data', chunk => body += chunk);
                    res.on('end', () => {
                      if (res.statusCode < 200 || res.statusCode >= 300) {
                        reject(new Error(`GHE team lookup failed with HTTP ${res.statusCode}: ${body}`));
                        return;
                      }
                      resolve(JSON.parse(body));
                    });
                  });
                  req.on('error', reject);
                  req.end();
                });
                for (const member of data) if (member.login) members.add(member.login);
                if (!Array.isArray(data) || data.length < 100) break;
                page += 1;
              }
              teamCache.set(cacheKey, members);
              return members;
            }

            const failures = [];
            const summaries = [];
            for (const [authorityName, required] of requirements.entries()) {
              const authority = authorities[authorityName];
              const members = await getTeamMembers(authority.ghe_host, authority.org, authority.team_slug, token);
              const authorityApprovers = approvingUsers.filter(user => members.has(user));
              const teamRef = `${authority.org}/${authority.team_slug}`;
              summaries.push(`${authorityApprovers.length}/${required} ${teamRef}`);
              if (authorityApprovers.length < required) {
                failures.push(`${authorityName} needs ${required}, has ${authorityApprovers.length}`);
              }
              console.log(`${authorityName}: ${authorityApprovers.join(', ') || 'none'} (${authorityApprovers.length}/${required})`);
            }

            const passed = failures.length === 0;
            const description = passed
              ? `✅ Review Gate passed: ${summaries.join('; ')}`
              : `❌ Review Gate pending: ${summaries.join('; ')}`;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: passed ? 'success' : 'pending',
              context: 'Review Gate',
              description: description.substring(0, 140),
              target_url: `${pr.data.html_url}#pullrequestreview`
            });

            console.log(`Review Gate: ${description}`);
            console.log(`Approving users: ${approvingUsers.join(', ') || 'none'}`);
            console.log(`Requirement reasons: ${requirementReasons.join('; ')}`);
            if (failures.length) console.log(`Failures: ${failures.join('; ')}`);
