name: Tenant Registry Request
about: Request tenant metadata or cross-tenant reference pre-approval
title: "Tenant registry request: <tenant-or-team-name>"
labels:
  - tenant-onboarding
  - governance
body:
  - type: markdown
    attributes:
      value: |
        Use this form for SG framework tenant registry requests.

        Platform/security will review the issue and convert approved requests into registry PRs. This form does not automate registry changes.

        Tenants are durable ownership domains, not one-off app names.

  - type: dropdown
    id: request_type
    attributes:
      label: What do you need?
      options:
        - Create a new tenant
        - Update an existing tenant
        - Request cross-tenant reference pre-approval
    validations:
      required: true

  - type: input
    id: tenant_slug
    attributes:
      label: Tenant slug, requested or existing
      description: Lowercase kebab-case if known. Platform/security may adjust during review.
      placeholder: payments-platform
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: Display name
      placeholder: Payments Platform
    validations:
      required: false

  - type: textarea
    id: ownership_domain
    attributes:
      label: What does this tenant own?
      description: Describe the team/platform/workload boundary in normal language.
      placeholder: This tenant owns payments platform workloads in shared EKS accounts...
    validations:
      required: true

  - type: input
    id: owner_team
    attributes:
      label: Owner team
      placeholder: payments-platform
    validations:
      required: true

  - type: input
    id: carids
    attributes:
      label: CARID(s)
      description: Comma-separated CARIDs associated with this tenant.
      placeholder: "600001725"
    validations:
      required: true

  - type: input
    id: tenant_accounts
    attributes:
      label: AWS account ID(s) for this tenant
      description: List the AWS account IDs where this team owns or operates workloads for this tenant.
      placeholder: "123456789012, 210987654321"
    validations:
      required: true

  - type: input
    id: ghe_team_slug
    attributes:
      label: GHE reviewer team slug
      description: "Team slug under github.aexp.com/orgs/amex-eng/teams/. Example: payments-platform"
      placeholder: payments-platform
    validations:
      required: true

  - type: textarea
    id: owned_networks
    attributes:
      label: Tenant-owned network surfaces, optional
      description: Register routable CIDRs/prefixes this tenant owns so CIDR-based PRs can route review to the owner instead of NetSec/platform.
      placeholder: |
        payments-api-prod:
          cidrs:
            - 10.42.16.0/24
          description: Payments API routable range.
    validations:
      required: false

  - type: textarea
    id: reference_grant
    attributes:
      label: Cross-tenant reference pre-approval, optional
      description: Only fill this out if requesting pre-approval for other tenants to reference SGs or owned networks owned by this tenant.
      placeholder: |
        name: allow-payments-api-https
        target_sgs:
          - shared-api
        target_networks:
          - payments-api-prod
        source_tenants:
          - data-platform
        protocols:
          - tcp
        ports:
          - 443
        directions:
          - egress
        expires: null
        reason: Payments API accepts HTTPS from data-platform.
    validations:
      required: false

  - type: textarea
    id: justification
    attributes:
      label: Why is this needed?
      description: Briefly explain the reason for this tenant/update/reference pre-approval.
      placeholder: Existing tenant metadata does not cover this ownership boundary because...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Quick checks
      options:
        - label: I checked existing tenants first.
          required: true
        - label: This is a durable ownership domain, not a temporary app/project name.
          required: true
        - label: The GHE team slug listed above can review SG requests for this tenant.
          required: true
        - label: If registering owned network surfaces, this tenant owns the CIDRs. Access pre-approval belongs in reference grants, not owned_networks.
          required: false
        - label: If requesting cross-tenant pre-approval, this tenant owns the referenced SG/network and accepts the listed access pattern.
          required: false
