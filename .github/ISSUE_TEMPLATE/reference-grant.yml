name: Reference grant request
description: Request pre-approval for tenants to reference tenant-owned SGs or network surfaces.
title: "Reference grant request: <target-tenant>/<grant-name>"
labels: ["reference-grant", "governance"]
body:
  - type: markdown
    attributes:
      value: |
        Use this to request a pre-approved access pattern against a tenant-owned SG or owned network.

        Narrow grants are reviewed by the target tenant owner. Broad grants also require platform review.

  - type: input
    id: target_tenant
    attributes:
      label: Target tenant
      description: Tenant that owns the target SG/network.
      placeholder: payments
    validations:
      required: true

  - type: input
    id: grant_name
    attributes:
      label: Grant name
      description: Lowercase kebab-case stable grant name.
      placeholder: allow-data-to-payments-api-https
    validations:
      required: true

  - type: textarea
    id: target_sgs
    attributes:
      label: Target SGs, optional
      description: SG names owned by the target tenant, one per line or comma-separated.
      placeholder: shared-api
    validations:
      required: false

  - type: textarea
    id: target_networks
    attributes:
      label: Target owned networks, optional
      description: owned_networks names owned by the target tenant, one per line or comma-separated.
      placeholder: payments-api-prod
    validations:
      required: false

  - type: textarea
    id: source_tenants
    attributes:
      label: Source tenants
      description: Tenant slugs allowed to use this grant, one per line/comma-separated. Use * only when intentionally broad.
      placeholder: data-platform
    validations:
      required: true

  - type: textarea
    id: protocols
    attributes:
      label: Protocols
      description: tcp, udp, icmp, or *.
      placeholder: tcp
    validations:
      required: true

  - type: textarea
    id: ports
    attributes:
      label: Ports
      description: Ports one per line/comma-separated. Use * only when intentionally broad.
      placeholder: "443"
    validations:
      required: false

  - type: textarea
    id: port_ranges
    attributes:
      label: Port ranges, optional
      description: YAML list of {from_port,to_port} ranges.
      placeholder: |
        - from_port: 8443
          to_port: 8445
    validations:
      required: false

  - type: textarea
    id: directions
    attributes:
      label: Directions
      description: ingress, egress, or *.
      placeholder: egress
    validations:
      required: true

  - type: input
    id: expires
    attributes:
      label: Expiry, optional
      description: ISO date or null. Broad grants without expiry require platform review.
      placeholder: "2026-12-31"
    validations:
      required: false

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Business/application justification.
      placeholder: Data platform needs HTTPS egress to Payments API.
    validations:
      required: true

  - type: checkboxes
    id: attestations
    attributes:
      label: Attestations
      options:
        - label: The target tenant owns the target SGs/networks listed above.
          required: true
        - label: Broad grants may require platform review in addition to target tenant review.
          required: true
