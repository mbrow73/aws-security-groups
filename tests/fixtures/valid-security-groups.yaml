account_id: "123456789012"
environment: "dev"
carid: "600001725"
default_region: "us-east-1"

security_groups:
  app-api:
    description: "Valid API SG"
    ingress:
      - protocol: "tcp"
        from_port: 443
        to_port: 443
        security_groups: ["app-lb"]
        description: "HTTPS from LB"
    egress:
      - protocol: "tcp"
        from_port: 443
        to_port: 443
        prefix_list_ids: ["shared-onprem-networks"]
        description: "HTTPS to shared onprem"
