# AWS Security Group Platform - Example Configuration
# Copy to accounts/<your-account-id>/security-groups.yaml

account_id: "123456789012"
environment: "prod"  # prod | test | dev
carid: "600001725"   # Your application's CARID
default_region: "us-east-1"  # Legacy fallback when account-level regions is not set
regions: ["us-east-1", "us-west-2"]  # Optional account-wide deployment regions for SGs without explicit region(s)

# Note: Platform built-in SGs, such as vpc-endpoints, are created automatically and can be referenced like normal SGs.
# Note: Shared/self-service prefix lists are managed in shared-prefix-lists.yaml.
# Note: Corporate mandatory tags are auto-generated from environment + carid.
#       You do NOT need to specify them per security group.

# Team security groups
security_groups:

  # Example: Application behind NLB (inherits account-level regions above)
  app-backend:
    description: "Backend API service"
    owner: "payments-platform"        # Optional reviewer/owner hint
    ticket: "NETSEC-1234"             # Optional audit/change ticket
    attach_to:                         # Optional attachment intent metadata
      - "eks-nodegroup:payments-prod-workers"
    ingress:
      - protocol: "tcp"
        from_port: 8080
        to_port: 8080
        security_groups: ["sg-0123456789abcdef0"]
        description: "HTTP from ALB"
      - protocol: "tcp"
        from_port: 9090
        to_port: 9090
        cidr_blocks: ["10.160.0.0/16"]
        description: "Prometheus scraping"
        group: "observability"
        ticket: "APP-4567"
        expires_at: "2026-09-30"
    egress:
      - protocol: "tcp"
        from_port: 5432
        to_port: 5432
        security_groups: ["rds-postgres"]
        description: "PostgreSQL access"
      - protocol: "tcp"
        from_port: 443
        to_port: 443
        prefix_list_ids: ["shared-onprem-networks"]
        description: "On-prem services via TGW"
      - protocol: "tcp"
        from_port: 443
        to_port: 443
        security_groups: ["vpc-endpoints"]
        description: "ECR, S3, STS, CloudWatch via VPC endpoints"
      - protocol: "udp"
        from_port: 53
        to_port: 53
        cidr_blocks: ["10.0.0.0/8"]
        description: "DNS resolution"

  # Example: Database (inherits account-level regions above)
  rds-postgres:
    description: "PostgreSQL RDS"
    ingress:
      - protocol: "tcp"
        from_port: 5432
        to_port: 5432
        security_groups: ["app-backend"]
        description: "PostgreSQL from app servers"

  # Example: Cache in a single region (explicit SG-level regions override)
  west-cache:
    regions: ["us-west-2"]
    description: "Redis cache in us-west-2"
    ingress:
      - protocol: "tcp"
        from_port: 6379
        to_port: 6379
        cidr_blocks: ["10.200.0.0/16"]
        description: "Redis from app tier"
