# Shared Prefix Lists — created by this repo in each target account/region
#
# Teams can reference these in security-groups.yaml using prefix_list_ids by name.
# Example:
#   prefix_list_ids: ["shared-onprem-networks"]
#
# Region support:
# - Use `region:` for a single-region shared prefix list
# - Use `regions:` for the same shared prefix list name in multiple regions
#
# Fill in the placeholder CIDRs below with the real on-prem ranges you want exposed.

shared_prefix_lists:
  shared-onprem-networks:
    regions:
      - us-east-1
      - us-west-2
    address_family: IPv4
    max_entries: 10
    tags:
      Owner: netsec
      Scope: shared
    entries:
      - cidr: 10.255.0.0/16
        description: PLACEHOLDER on-prem summary 1
      - cidr: 10.254.0.0/16
        description: PLACEHOLDER on-prem summary 2
